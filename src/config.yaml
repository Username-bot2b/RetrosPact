site:
  name: RetrosPact
  site: 'https://retros-pact.vercel.app'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: RetrosPact
    template: '%s — RetrosPact'
  description: 'A personal website with a SerenityOS-inspired desktop UI, built with Astro and Tailwind CSS.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: RetrosPact
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

    # Giscus comments for the live demo. Forks should replace repo / repoId /
    # categoryId with values from https://giscus.app, or set enabled: false.
    comments:
      enabled: true
      repo: 'Username-bot2b/RetrosPact'
      repoId: 'R_kgDOT9VZgA'
      category: 'Announcements'
      categoryId: 'DIC_kwDOT9VZgM4DJeyX'
      mapping: pathname
      strict: false
      reactionsEnabled: true
      emitMetadata: false
      inputPosition: top
      lang: en

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
